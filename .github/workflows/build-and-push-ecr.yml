# Maestra addition — NOT an upstream file (safe under "Update branch" merges).
#
# Builds .docker/Dockerfile-maestra-distroless from this fork's master and
# pushes it to the private ECR as `hydra:master-<date>-<sha7>` + `latest`.
# Runs on every push to master — i.e. automatically after each one-click
# "Update branch" sync from ory/hydra — and on manual dispatch.
# Auth is the standard image-push pattern: GitHub OIDC → Teleport tbot
# workload identity → AWS STS → ECR (token image-push-github-actions-hydra,
# defined in fluxcd teleport-maestra/image-push-workload-identity.yaml).
name: Build and Push to ECR

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-and-push-ecr
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  ECR_REGISTRY: 515260921971.dkr.ecr.us-west-2.amazonaws.com
  AWS_REGION: us-west-2
  TELEPORT_FQDN: teleport.maestra.io:443
  TELEPORT_TOKEN: image-push-github-actions-hydra
  AWS_ROLE_ARN: "arn:aws:iam::515260921971:role/teleport-image-push"
  IMAGE_NAME: hydra

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Get Teleport version
        id: tp-version
        run: |
          VERSION=$(curl -sf "https://${{ env.TELEPORT_FQDN }}/webapi/find" | jq -r '.auto_update.tools_version // .server_version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Teleport binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/teleport
          key: teleport-${{ steps.tp-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Teleport
        uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6  # v1.1.1
        with:
          version: ${{ steps.tp-version.outputs.version }}
          proxy: ${{ env.TELEPORT_FQDN }}

      - name: ECR login via Teleport Workload Identity
        run: |
          cat > /tmp/tbot.yaml << EOF_TBOT
          version: v2
          proxy_server: ${{ env.TELEPORT_FQDN }}
          onboarding:
            join_method: github
            token: ${{ env.TELEPORT_TOKEN }}
          oneshot: true
          storage:
            type: memory
          services:
            - type: workload-identity-jwt
              destination:
                type: directory
                path: /tmp/tbot-output
              selector:
                name: image-push
              audiences: ["sts.amazonaws.com"]
          EOF_TBOT

          mkdir -p /tmp/tbot-output

          # tbot's oneshot mode spawns a heartbeat service alongside the
          # workload-identity-jwt one; the heartbeat occasionally dies with a
          # transient gRPC EOF even though the JWT was written. Trust the JWT
          # file, then validate it against STS before using it for ECR.
          set +e
          tbot start -c /tmp/tbot.yaml
          TBOT_RC=$?
          set -e
          if [ ! -s /tmp/tbot-output/jwt_svid ]; then
            echo "tbot exited $TBOT_RC and did not write a JWT — failing"
            exit 1
          fi
          if [ $TBOT_RC -ne 0 ]; then
            echo "tbot exited $TBOT_RC (JWT written — likely transient heartbeat EOF; validating with STS next)"
          fi

          export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/tbot-output/jwt_svid
          export AWS_ROLE_ARN="${{ env.AWS_ROLE_ARN }}"
          export AWS_DEFAULT_REGION=${{ env.AWS_REGION }}

          aws sts get-caller-identity > /dev/null

          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login ${{ env.ECR_REGISTRY }} --username AWS --password-stdin

          # master-<date>-<sha7> tags are immutable: a published tag must never be
          # silently overwritten (2026-10-09: GitLab re-minted release numbers after a
          # restore and CI overwrote released images). `latest` is moving, so it is
          # excluded.
          aws ecr describe-repositories --repository-names ${{ env.IMAGE_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws ecr create-repository --repository-name ${{ env.IMAGE_NAME }} --region ${{ env.AWS_REGION }} \
            --image-tag-mutability IMMUTABLE_WITH_EXCLUSION \
            --image-tag-mutability-exclusion-filters 'filterType=WILDCARD,filter=latest'

      - name: Compute tags
        id: tags
        run: |
          SHA7=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=master-$(date -u +%Y%m%d)-${SHA7}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # BuildKit pushes only the layers ECR lacks; `docker push` from the fresh
      # runner daemon re-uploaded every layer of every release.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: .docker/Dockerfile-maestra-distroless
          build-args: |
            HYDRA_VERSION=${{ steps.tags.outputs.tag }}
          labels: |
            org.opencontainers.image.created=${{ steps.tags.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=hydra
            org.opencontainers.image.source=https://github.com/maestra-io/hydra
            org.opencontainers.image.vendor=maestra-io
          provenance: false
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
